  <style>
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      z-index: 9999;
    }

    .splash-screen__logo {
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>

  <app-root>
    <div class="splash-screen">

    </div>
