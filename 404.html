<body>
  <app-root></app-root>
  <style>
    #global-loader {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: #ffffff;
      display: flex; 
      justify-content: center; 
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    
    #global-loader .logo {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 
      0% { opacity: 0.3 } 
      50% { opacity: 1 }
      100% { opacity: 0.3 }  
    }
  </style>
  <div id="global-loader">
    <img class="logo" src="/logo.svg" alt="NT">
  </div>
  <script>
    window.addEventListener('load', function() {
      const loader = document.getElementById('global-loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.remove(), 300);
      }
    });
  </script>
<script src="main-HMSMYW4T.js" type="module"></script></body>
